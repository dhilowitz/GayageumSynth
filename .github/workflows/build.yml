name: Build

# Builds GayageumSynth on hosted GitHub runners (no persistent build machine, no
# code signing/notarization - unsigned dev builds only). The JUCE checkout lives
# in the `JUCE` git submodule rather than the ~/SDKs/JUCE convention used by the
# other Decidedly projects, so the .jucer's module paths are configured with
# useGlobalPath="0" and a project-root-relative modulePath ("JUCE/modules").
# Projucer re-relativizes that correctly per exporter (e.g. Xcode's
# $(SRCROOT)/../../JUCE/modules, the Makefile's -I../../JUCE/modules), so the
# committed Xcode/VisualStudio/Makefile projects are portable as-is - CI just
# builds them directly, no on-runner Projucer build or resave required.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Add MSBuild to PATH
        if: matrix.platform == 'windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        run: |
          xcodebuild -project "Builds/MacOSX/GayageumSynth.xcodeproj" \
            -scheme "GayageumSynth - All" -configuration Release build

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: msbuild "Builds\VisualStudio2022\GayageumSynth.sln" /p:Configuration=Release /p:Platform=x64 /m

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: make -C Builds/LinuxMakefile CONFIG=Release -j$(nproc)

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p artifacts
          find ~/Library/Developer/Xcode/DerivedData -name "GayageumSynth.vst3" -exec cp -R {} artifacts/ \;
          find ~/Library/Developer/Xcode/DerivedData -name "GayageumSynth.component" -exec cp -R {} artifacts/ \;
          find ~/Library/Developer/Xcode/DerivedData -name "GayageumSynth.app" -exec cp -R {} artifacts/ \;
          cd artifacts && zip -r "../GayageumSynth-mac.zip" .

      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          find Builds/VisualStudio2022 -ipath "*Release*" -iname "GayageumSynth.vst3" -exec cp -r {} artifacts/ \;
          find Builds/VisualStudio2022 -ipath "*Standalone*" -iname "GayageumSynth.exe" -exec cp {} artifacts/ \;
          cd artifacts && 7z a "../GayageumSynth-windows.zip" .

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p artifacts
          find Builds/LinuxMakefile/build -iname "GayageumSynth.vst3" -exec cp -R {} artifacts/ \;
          find Builds/LinuxMakefile/build -maxdepth 1 -type f -iname "GayageumSynth" -exec cp {} artifacts/ \;
          cd artifacts && zip -r "../GayageumSynth-linux.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GayageumSynth-${{ matrix.platform }}
          path: GayageumSynth-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --generate-notes
