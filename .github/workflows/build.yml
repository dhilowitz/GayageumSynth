name: Build

# Builds GayageumSynth on hosted GitHub runners (no persistent build machine, no
# code signing/notarization - unsigned dev builds only). The JUCE checkout lives
# in the `JUCE` git submodule (pinned tag), so unlike the other Decidedly projects
# there's no ~/SDKs/JUCE to point at; instead we build Projucer from that submodule
# on each runner and use `--set-global-search-path` + `--resave` to point every
# exporter at the checked-out submodule before building, rather than trusting
# whatever machine-specific paths happen to be baked into the committed
# Xcode/VisualStudio/Makefile projects.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            os_id: osx
          - os: windows-latest
            platform: windows
            os_id: windows
          - os: ubuntu-latest
            platform: linux
            os_id: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Add MSBuild to PATH
        if: matrix.platform == 'windows'
        uses: microsoft/setup-msbuild@v2

      - name: Get JUCE submodule commit
        id: juce-sha
        shell: bash
        run: echo "sha=$(git -C JUCE rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Projucer build
        id: projucer-cache
        uses: actions/cache@v4
        with:
          path: JUCE/cmake-build-projucer
          key: projucer-${{ matrix.platform }}-${{ steps.juce-sha.outputs.sha }}

      - name: Build Projucer
        if: steps.projucer-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -B JUCE/cmake-build-projucer -S JUCE -DJUCE_BUILD_EXTRAS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build JUCE/cmake-build-projucer --target Projucer --config Release --parallel

      - name: Locate Projucer binary
        id: projucer-bin
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            BIN=$(find JUCE/cmake-build-projucer -iname "Projucer.exe" -type f | head -1)
          else
            BIN=$(find JUCE/cmake-build-projucer -type f -name "Projucer" -perm -u+x -not -path "*.dSYM*" | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "Could not locate built Projucer binary" >&2
            find JUCE/cmake-build-projucer -iname "Projucer*"
            exit 1
          fi
          echo "Found Projucer at: $BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Point project at the checked-out JUCE submodule and resave
        shell: bash
        run: |
          BIN="${{ steps.projucer-bin.outputs.bin }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            MODULES_PATH="$(cygpath -w "$(pwd)/JUCE/modules")"
          else
            MODULES_PATH="$(pwd)/JUCE/modules"
          fi
          RUN=("$BIN")
          if [ "${{ matrix.platform }}" = "linux" ]; then
            RUN=(xvfb-run -a "$BIN")
          fi
          "${RUN[@]}" --set-global-search-path "${{ matrix.os_id }}" defaultJuceModulePath "$MODULES_PATH"
          "${RUN[@]}" --resave GayageumSynth.jucer

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        run: |
          xcodebuild -project "Builds/MacOSX/GayageumSynth.xcodeproj" \
            -scheme "GayageumSynth - All" -configuration Release build

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: msbuild "Builds\VisualStudio2022\GayageumSynth.sln" /p:Configuration=Release /p:Platform=x64 /m

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a make -C Builds/LinuxMakefile CONFIG=Release -j$(nproc)

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p artifacts
          find ~/Library/Developer/Xcode/DerivedData -name "GayageumSynth.vst3" -exec cp -R {} artifacts/ \;
          find ~/Library/Developer/Xcode/DerivedData -name "GayageumSynth.component" -exec cp -R {} artifacts/ \;
          find ~/Library/Developer/Xcode/DerivedData -name "GayageumSynth.app" -exec cp -R {} artifacts/ \;
          cd artifacts && zip -r "../GayageumSynth-mac.zip" .

      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          find Builds/VisualStudio2022 -ipath "*Release*" -iname "GayageumSynth.vst3" -exec cp -r {} artifacts/ \;
          find Builds/VisualStudio2022 -ipath "*Standalone*" -iname "GayageumSynth.exe" -exec cp {} artifacts/ \;
          cd artifacts && 7z a "../GayageumSynth-windows.zip" .

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p artifacts
          find Builds/LinuxMakefile/build -iname "GayageumSynth.vst3" -exec cp -R {} artifacts/ \;
          find Builds/LinuxMakefile/build -maxdepth 1 -type f -iname "GayageumSynth" -exec cp {} artifacts/ \;
          cd artifacts && zip -r "../GayageumSynth-linux.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GayageumSynth-${{ matrix.platform }}
          path: GayageumSynth-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --generate-notes
